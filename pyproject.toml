[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airoa-metadata"
version = "1.3.0"
description = "A Python library for handling versioned metadata for robotic data collection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Petr Khrapchenkov", email = "petr@example.com" },
]
maintainers = [
    { name = "Tokyo University Matsuo Iwasawa Laboratory" },
    { name = "AIROA" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["robotics", "metadata", "data-collection", "json-schema", "versioning"]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.16.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "black>=22.0.0",
    "ruff>=0.11.13",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/airoa-org/airoa-metadata"
Repository = "https://github.com/airoa-org/airoa-metadata.git"
Documentation = "https://airoa-metadata.readthedocs.io/"
"Bug Tracker" = "https://github.com/airoa-org/airoa-metadata/issues"

[tool.hatch.build]
include = [
    "airoa_metadata",
    "airoa_metadata/schemas/*.json",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
# Pythonバージョン
target-version = "py310"

# ルールセット
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "B", # flake8-bugbear
    "I", # isort
]
ignore = [
    "E501", # line too long, handled by black
]
unfixable = [
    "F401", # module imported but unused
    "F841", # local variable is assigned to but never used
]
line-length = 88

# 除外パス
exclude = [
    ".venv",
    "build",
    "dist",
]
